# Bump the package version when a merged pull request changes it, in a commit to main.
name: Bump version

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Bump the version
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEVEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') && 'major' || contains(github.event.pull_request.labels.*.name, 'minor') && 'minor' || 'patch' }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if ! grep -qE '^(src/|pyproject\.toml$)' <<<"$files"; then
            echo "#$PR changes nothing that has a version"
            exit 0
          fi
          uv version --bump "$LEVEL"
          version=$(uv version --short)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Bump the version to $version for #$PR"
          git pull --rebase origin main
          git tag "v$version"
          git push --atomic origin main "v$version"
