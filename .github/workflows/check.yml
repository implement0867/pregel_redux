# Run make check on each pull request, and post the test coverage as a commit status.
name: Check

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'Makefile', '.github/workflows/check.yml']

permissions:
  contents: read
  statuses: write

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: uv.lock
      - run: make check
      - name: Post the coverage
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          total=$(uv run coverage report --format=total) && state=success || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=coverage -f description="$total%"
