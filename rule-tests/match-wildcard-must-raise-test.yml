id: match-wildcard-must-raise
valid:
  - |
    match payload:
        case Mapping():
            return parse(payload)
        case _:
            assert_never(payload)
  - |
    match payload:
        case Mapping():
            return parse(payload)
        case _:
            raise TypeError(payload)
  - |
    match payload:
        case Mapping():
            return parse(payload)
        case other:
            assert_never(other)
invalid:
  - |
    match payload:
        case Mapping():
            return parse(payload)
        case _:
            return payload
  - |
    match payload:
        case Mapping():
            return parse(payload)
        case other:
            return other
  - |
    match statement:
        case Insert():
            hold()
        case _:
            pass
